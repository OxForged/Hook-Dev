<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Was a single #04060C, the old dark ground. Canvas has two, so this does
         too: paper in light, near-black in dark. Both are the --void token. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F3EF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1013" />

    <!-- Anti-flash: set data-theme synchronously, before any stylesheet loads.
         Mirrors lib/theme.ts's storage contract (key `latch-theme`, values
         light|dark|system) but cannot import it — inline scripts run before
         any module graph exists. `system` sets nothing: absence of the
         attribute is what lets tokens.css fall through to its
         prefers-color-scheme media query, so there is nothing to compute
         here for that case. Must never throw. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('latch-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>

    <title>Latch Protocol</title>
    <meta
      name="description"
      content="Infrastructure for Latches — hook contracts that attach programmable logic to AMM pools, lending markets and assets without forking the protocol underneath."
    />

    <!-- FAVICON, THEME-AWARE.

         The mark is a white hook plus a blue crescent on transparency. On dark
         browser chrome it reads whole; on LIGHT chrome the white hook vanishes
         and all you see is the crescent — half a logo. That is the bug, not a
         preference.

         So there are two sets. The `-light.png` files are the same asset with
         only the near-white pixels remapped to --ink (#12151A), derived
         programmatically from the originals rather than redrawn: the blue is
         untouched and antialiasing is preserved. Generated by the snippet in
         SOURCES.md; regenerate from the originals if the mark ever changes.

         `/brand/favicon.svg` is deliberately NOT referenced any more. It is a
         512x512 <image> element with no href attribute and 7.7KB of C2PA
         metadata — it renders nothing. Being listed first as
         type="image/svg+xml" meant any browser preferring SVG got a blank icon.
         The same is true of latch-mark.svg and latch-wordmark.svg; all three
         need re-exporting before any of them can be used.

         Apple touch icon stays the white version: iOS flattens transparency to
         black, so the white hook is the one that shows. -->
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="/brand/favicon-32-light.png" />
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: light)" href="/brand/favicon-16-light.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)" href="/brand/favicon-16.png" />
    <!-- Fallback for anything that ignores `media` on an icon link. The ink
         version is the safer default: it is legible on white and on grey, where
         the white one is legible on neither. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32-light.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social scrapers (X, Facebook, LinkedIn, Discord, Slack, WhatsApp) do NOT resolve
         relative og:image paths — they fetch the URL verbatim off-host and drop the card
         when it 404s. Every absolute URL below is therefore built from %SITE_URL%, which
         vite.config.ts substitutes at build time (VITE_SITE_URL, defaulting to the
         canonical origin). Keep them absolute. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Latch Protocol" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Latch Protocol — Latches for a bigger ecosystem" />
    <meta
      property="og:description"
      content="Attach programmable logic to AMM pools, lending markets and assets without forking the protocol underneath."
    />
    <meta property="og:image" content="%SITE_URL%/brand/og-1200x630.png" />
    <!-- Declaring the intrinsic size lets a scraper lay the card out before the image
         finishes downloading. The file is a 2x asset: 2400x1260, a 1.91:1 OG ratio. -->
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Latch Protocol — Latches for a bigger ecosystem. Infrastructure for Latches: hook contracts that attach programmable logic to a pool."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Latch Protocol — Latches for a bigger ecosystem" />
    <meta
      name="twitter:description"
      content="Attach programmable logic to AMM pools, lending markets and assets without forking the protocol underneath."
    />
    <meta name="twitter:image" content="%SITE_URL%/brand/og-1200x630.png" />
    <meta
      name="twitter:image:alt"
      content="Latch Protocol — Latches for a bigger ecosystem. Infrastructure for Latches: hook contracts that attach programmable logic to a pool."
    />

    <!-- Canvas: Inter 400/500/600/700 (UI + display) · Instrument Serif italic
         (the display accent, one clause per headline) · JetBrains Mono 400/500
         (numbers and code). Weights are enumerated rather than requesting the
         variable range: the four used are the four served. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
