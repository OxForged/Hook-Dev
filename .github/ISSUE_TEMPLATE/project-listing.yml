# Ecosystem directory listing.
#
# This form is the submission path for apps/web's ecosystem directory
# (/ecosystem and the landing page's "Built on Latch" section). The site's
# "Submit app" form opens it prefilled via `buildListingIssue()` in
# apps/web/src/routes/ecosystem/data/ecosystem.ts. Field `id`s below are the URL
# query parameters that function sets — `LISTING_FIELDS` in that file is the
# other half of this list. Keep them in step.
#
# GitHub prefills issue-form fields from the URL for TEXT fields only (`input`
# and `textarea`). Category, Latch families and chains are therefore text
# inputs rather than a dropdown and checkboxes: a box the submitter already
# ticked on the site would otherwise arrive unticked. Only the confirmations
# stay checkboxes, because a person must tick those here.
#
# The site is static and uploads nothing. An icon is attached by dragging the
# file into the Icon box below.
#
# A merged listing is added to `ECOSYSTEM_PROJECTS` exactly as written. It is
# rendered as "submitted by the project, not verified by Latch Protocol" on
# every card; that is the status of the whole directory and nothing here
# changes it.

name: Ecosystem project listing
description: List a project that builds on Latch in the ecosystem directory.
title: "Ecosystem listing: "
labels: ["ecosystem"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building on Latch. Fill this in and a maintainer will merge the listing
        **as written**. Listing is free, there is no review of your product, and every entry
        is shown as *submitted by the project, not verified by Latch Protocol*.

        This directory lists **teams and products**. If you want a **Latch (hook contract)**
        itself listed, that is the on-chain registry — use *Deploy a Latch* in the dapp.

  - type: input
    id: project_name
    attributes:
      label: App name
      description: As you want it shown. 80 characters or fewer.
      placeholder: Acme Swap
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: Description
      description: Shown on the card under the name, as your words. 280 characters or fewer; the card shows the first three lines.
      placeholder: Time-boxed token launches with sniper protection built in.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Website
      description: Must be https. This is where the card links.
      placeholder: https://
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Public source repository (optional)
      placeholder: https://github.com/
    validations:
      required: false

  - type: input
    id: category
    attributes:
      label: Category
      description: >-
        One of DEX, Launchpad, Quests, Lending, RWA, Analytics, Wallet, Infrastructure —
        or "Other: " followed by your own.
      placeholder: DEX
    validations:
      required: true

  - type: input
    id: uses
    attributes:
      label: Which Latches does the project use?
      description: >-
        Comma-separated. Launch guard (LaunchGuardHook / BinLaunchGuardHook), Revenue share
        (RevShareHook), Permissioned pool (PermissionedPoolHook), Market hours
        (MarketHoursHook), Stock pair (StockPairHook), or Their own Latch (give the address
        or Marketplace link below).
      placeholder: Launch guard (launch-guard), Revenue share (rev-share)
    validations:
      required: true

  - type: input
    id: own_latch
    attributes:
      label: Your own Latch, if listed above
      description: Contract address, or the Marketplace link once it is registered.
      placeholder: 0x…
    validations:
      required: false

  - type: input
    id: chains
    attributes:
      label: Chains
      description: EIP-155 chain ids the integration is live on, comma-separated. Sepolia is 11155111; Robinhood Chain is 4663.
      placeholder: "4663"
    validations:
      required: true

  - type: textarea
    id: icon
    attributes:
      label: Icon (optional)
      description: >-
        Drag your icon file into this box to attach it — the Latch site does not upload it.
        It must be your own official mark exactly as published on your own site, CDN or
        GitHub org (never redrawn or recoloured): SVG preferred, otherwise a square PNG.
        Give the URL it is published at. Without one, the card shows a typographic monogram.
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Not rendered. A handle or address a maintainer can reach you at about this listing.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything a maintainer should know (optional)
      description: Not rendered. Launch timing, a link to the integration in your code.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I represent this project and am authorised to list it.
          required: true
        - label: I understand the listing is rendered as self-submitted and not verified by Latch Protocol, and that a maintainer may decline or remove it.
          required: true
        - label: I understand an icon is shown only if it is our own official asset with the URL it is published at. Otherwise the card shows a typographic monogram of the name.
          required: true
