<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Latch Protocol widgets — development harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --page-bg: #f4f5f7;
        --page-fg: #14161b;
        --page-muted: #5c6472;
        --page-panel: #ffffff;
        --page-border: #dfe3e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #0d0f13;
          --page-fg: #f2f4f8;
          --page-muted: #98a1b1;
          --page-panel: #161920;
          --page-border: #262a33;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 64px;
        background: var(--page-bg);
        color: var(--page-fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
      }
      .banner {
        padding: 14px 16px;
        margin-bottom: 20px;
        border: 2px solid #b45309;
        border-radius: 10px;
        background: #fff8e1;
        color: #7c3d00;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        .banner {
          background: #33280f;
          color: #fbbf5c;
        }
      }
      .banner p {
        margin: 4px 0 0;
        font-weight: 400;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .lede {
        margin: 0 0 20px;
        color: var(--page-muted);
        max-width: 70ch;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        padding: 14px;
        margin-bottom: 24px;
        background: var(--page-panel);
        border: 1px solid var(--page-border);
        border-radius: 10px;
      }
      .controls label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--page-muted);
      }
      .controls input,
      .controls select {
        height: 32px;
        padding: 0 8px;
        border: 1px solid var(--page-border);
        border-radius: 7px;
        background: var(--page-bg);
        color: var(--page-fg);
        font: inherit;
        font-size: 13px;
      }
      .controls input[type="checkbox"] {
        height: auto;
        align-self: center;
      }
      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        align-items: start;
      }
      .cell h2 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--page-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .narrow {
        max-width: 360px;
      }
      .note {
        margin-top: 8px;
        font-size: 12px;
        color: var(--page-muted);
      }
      pre {
        overflow-x: auto;
        padding: 12px;
        background: var(--page-panel);
        border: 1px solid var(--page-border);
        border-radius: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
