# The `latch` stack. Lives in ~/latch/keeper on whichever host runs it.
#
# Assume the host is SHARED. The previous one ran three unrelated production
# stacks beside this one, and a Caddy belonging to one of them owned :80 and
# :443 for all of them. Everything here is therefore namespaced and
# self-contained, and stays that way on a fresh host too:
#
#   project   latch          (set by `name:`, so it cannot inherit a directory name)
#   network   latch_net      (declared here, not the default bridge)
#   names     latch-*        (explicit, so `docker ps` shows ownership at a glance)
#   ports     none published (the keeper dials out; nothing needs to reach it)
#
# Always `docker compose -p latch ...` from this directory. A bare
# `docker compose down` run from the wrong path takes down somebody else's stack.
#
# THIS FILE IS A DRY RUN. It never passes `--execute`. To send, layer
# `compose.execute.yml` on top - see RUNBOOK.md.

name: latch

services:
  keeper:
    container_name: latch-keeper
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Config is mounted read-only. The keeper never writes it, and a container
    # that cannot modify its own target list is one fewer thing to reason about.
    #
    # KEEPER_CONFIG selects WHICH tracked config is mounted. The Robinhood one is
    # `./keeper.config.robinhood.json`; the default keeps the old name for a
    # local, gitignored file.
    volumes:
      - ${KEEPER_CONFIG:-./keeper.config.json}:/config/keeper.config.json:ro

    environment:
      # ABSENT BY DEFAULT, and that is the safe state: with no key the keeper
      # reports what it would do and sends nothing. Sending needs BOTH this and
      # --execute, so neither alone can start signing.
      #
      # Set it in .env beside this file (gitignored, chmod 600) only when the
      # stack is meant to act. It is a low-value key by construction — every
      # function the keeper calls is permissionless, so a stolen keeper key buys
      # an attacker nothing they could not already do from any address.
      #
      # NEVER put the deployer key here. During a deployment that key is briefly
      # the most valuable in the system.
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-}

    # Dry run on a 5-minute loop. `compose.execute.yml` is the only place
    # `--execute` appears.
    command: ["--config", "/config/keeper.config.json", "--interval", "${KEEPER_INTERVAL:-300}"]

    networks: [latch_net]

    logging:
      driver: json-file
      options:
        # The keeper logs every job every tick. Uncapped, that fills a disk.
        max-size: "10m"
        max-file: "3"

    # It holds a key and talks to the internet. Give it nothing else.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  latch_net:
    name: latch_net
